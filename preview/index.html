<style>
*{box-sizing:border-box}body{margin:0;background:#0e1018;color:#ebebf0;font:16px/1.4 Gotham,Montserrat,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}

.card:hover{background:#262d42}.ic{font-size:34px}.ct{font-weight:700;font-size:20px}.tag{color:#f0aa5a;font-size:12px;margin:4px 0}.bl{color:#aab;font-size:13px}.en{position:absolute;bottom:10px;left:12px;color:#78c896;font-size:13px;font-weight:700}

.bars{display:flex;gap:16px;margin:12px 0 6px}.bar{flex:1;height:22px;background:#0a0c12;border-radius:8px;position:relative;overflow:hidden}.bar i{position:absolute;inset:0 auto 0 0;transition:width .4s;border-radius:8px}.bar span{position:absolute;inset:0;text-align:center;font-size:13px;font-weight:700;line-height:22px}

.ch{display:block;width:100%;text-align:left;background:#2c344a;margin-bottom:8px;padding:12px;font-weight:500;font-size:18px}.ch:hover{background:#38425e}.ch.lock{background:#1e212c;color:#6e7382;cursor:default}
.end{background:#0e1018;border-radius:12px;padding:14px}.end h2{margin:0 0 8px}.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1;padding:12px}
@keyframes sh{0%,100%{transform:translate(0)}20%{transform:translate(-7px,4px)}40%{transform:translate(6px,-5px)}60%{transform:translate(-5px,-3px)}80%{transform:translate(5px,5px)}}.shake{animation:sh .25s 10}
</style><div id=tint></div><div id=app></div>
<script>
const S=[{"start": "start", "title": "Shaking Ground", "place": "Classroom", "blurb": "Second floor, Room 204. Period 3 maths. The floor starts to move.", "difficulty": "Easy", "id": "classroom", "nodes": {"start": {"choices": [{"next": "under_desk", "text": "Drop under your desk, grab a leg and hold on.", "effects": {"calm": -5}}, {"next": "run_door", "note": "You get knocked into the doorframe by the stampede.", "text": "Sprint for the door before the roof comes down.", "effects": {"calm": -20, "health": -25}}, {"next": "doorway", "note": "The door slams back and forth, hitting your shoulder.", "text": "Stand in the doorway. You heard that's the safest spot.", "effects": {"calm": -10, "health": -15}}], "text": "Period 3, Room 204. Ms. Okafor is mid-sentence about quadratic equations when your pencil rolls off the desk. Then the lights sway. A low rumble rises through the floor and the windows begin to rattle.\n\n\"Is that a truck?\" someone whispers. Then the whole room lurches sideways.", "fx": "calm"}, "corridor": {"choices": [{"next": "lift", "chance": {"win": "outside_safe", "p": 0.35, "lose": "lift_stuck"}, "text": "Take the lift. It's fastest and the button is lit.", "note": "You press the button..."}, {"note": "Your torch beam cuts through the dark.", "next": "back_stairs", "requires": {"items": ["torch"]}, "text": "Use the dark back stairs.", "effects": {"calm": 5}}, {"text": "Feel your way down the back stairs without light.", "next": "back_stairs_dark"}, {"text": "Stay with the teacher's group at the blocked stairs.", "next": "aftershock"}], "text": "The corridor is half-dark and littered with ceiling tiles and glass. At one end the stairwell is blocked by a collapsed wall. At the other end, a back staircase is open but the emergency lighting is out. The lift is right in front of you with its call button still glowing.\n\nMs. Okafor is leading the main group toward the blocked stairs, hoping to clear a path.", "fx": "dark"}, "lift_stuck": {"lesson": "Never use lifts during or after an earthquake. Power failures and aftershocks can trap you, and cables can be damaged.", "ending": {"kind": "survived", "title": "Stuck Between Floors"}, "text": "The lift jolts, drops half a floor, and stops dead. The lights go out. You are trapped in a metal box between floors with no signal. An aftershock rattles the cables. It takes rescue crews six hours to get you out.", "fx": "dark"}, "hero_ending": {"lesson": "Calm leadership saves lives. In an emergency, helping others get out safely is the best use of what you know.", "ending": {"kind": "hero", "title": "The Class Remembers"}, "text": "On the field, teachers take a head count. When your name is called, Ms. Okafor squeezes your shoulder. \"You made sure everyone got out.\"\n\nYour class gets a new meeting point and a new fire drill, and you are the one who explains it to the Year 7s.", "fx": "calm"}, "outside_safe": {"lesson": "After the shaking stops: check for injuries, leave via stairs, stay clear of damaged buildings and power lines, and expect aftershocks.", "ending": {"kind": "survived", "title": "On the Field"}, "text": "You step out into the cold air of the field. Sirens are far off. Teachers are counting heads. Power lines hang from a pole near the gate, so everyone is waved away from them.\n\nYou are safe. Your hands do not stop shaking for a long time.", "fx": "calm"}, "death": {"lesson": "Most earthquake injuries come from falling objects and panic. Drop, cover, and hold on, and move slowly and calmly afterwards.", "ending": {"kind": "died", "title": "Did Not Make It"}, "text": "The ceiling, the crowd, or the next aftershock. In the end the building took more than you could handle. Your classmates will never forget this day.", "fx": "dark"}, "doorway": {"choices": [{"text": "Check yourself over, then look around the room.", "next": "shaking_stops"}], "text": "You brace in the doorway. Modern doorframes are no stronger than the rest of the building, and the door keeps swinging. You get pinned for a moment, then freed when a classmate drags you down to the floor.\n\n\"Get DOWN!\" she yells. Shortly after, the shaking stops.", "fx": "quake"}, "rescue_group": {"choices": [{"text": "Lead them down and out to the football field.", "next": "hero_ending"}], "text": "You climb back up and shout through the gap. \"The back stairs are open! Use my torch, come this way!\" Fifteen students and Ms. Okafor file past you in the dark. One of them is the kid who was too scared to move.", "fx": "calm"}, "aftershock": {"choices": [{"next": "outside_safe", "text": "Drop, cover, and hold on right where you are.", "effects": {"calm": -5}}, {"next": "outside_safe", "chance": {"win": "outside_safe", "p": 0.5, "lose": "death", "loseEffects": {"health": -60}}, "text": "Run toward the back stairs.", "note": "Running during shaking is risky..."}], "text": "Twenty minutes later, an aftershock hits. Plaster rains down in the corridor. The group at the blocked stairs scatters.", "fx": "quake"}, "back_stairs_dark": {"choices": [{"next": "outside_safe", "note": "Your ankle throbs, but you make it down.", "text": "Grit your teeth and keep going.", "effects": {"health": -20}}, {"text": "Sit and wait for help.", "next": "aftershock"}], "text": "You grip the rail and take it one step at a time. On the third landing, your foot finds a gap where the stairs have shifted. You stumble and wrench your ankle, but catch the rail.", "fx": "dark"}, "back_stairs": {"choices": [{"next": "rescue_group", "text": "Go back up and guide them to the back stairs.", "effects": {"calm": -10}}, {"text": "Keep going. Get outside and tell the rescuers.", "next": "outside_safe"}], "text": "With the torch you spot a gap where the staircase has pulled away from the wall, and you step carefully around it. Halfway down you hear shouting from the blocked group above.", "fx": "dark"}, "run_door": {"choices": [{"next": "shaking_stops", "text": "Crawl back into the classroom and get under a desk.", "effects": {"health": -5}}, {"text": "Keep pushing toward the stairwell.", "next": "hallway_crush"}], "text": "You make it three steps before the floor throws you against a bookcase. The corridor is full of kids pushing the same way. Something heavy lands near your feet. Dust fills the air.\n\nThe shaking is easing off. Your ears are ringing.", "fx": "quake"}, "shaking_stops": {"choices": [{"next": "corridor", "text": "Grab the first-aid kit from the wall.", "effects": {"give": ["first-aid kit"]}}, {"next": "corridor", "text": "Grab your backpack: it has a torch and a water bottle.", "effects": {"give": ["torch", "water"]}}, {"next": "corridor", "text": "Take nothing and head for the door right now.", "effects": {"calm": 5}}], "text": "Silence. Then coughing, crying, a phone buzzing somewhere. The shaking has stopped. The lights are out, the fire alarm is howling, and dust hangs in the air.\n\nMs. Okafor stands by the whiteboard, pale but steady. \"Everyone listen. We are going to leave the building calmly. Take one thing each, but nothing heavy. Go.\"", "fx": "calm"}, "hallway_crush": {"choices": [{"next": "shaking_stops", "note": "The crowd loosens a little. People can breathe again.", "text": "Step back and help calm the people around you.", "effects": {"health": -5, "calm": 10}}, {"next": "death", "note": "You fall into the crush.", "text": "Climb over the pile to get out first.", "effects": {"health": -80}}], "text": "The stairwell door is jammed with people. Someone trips and the crowd surges. You are pinned against the wall, struggling to breathe, until a teacher's voice cuts through: \"STOP PUSHING. Everyone step back!\"", "fx": "dark"}, "under_desk": {"choices": [{"next": "shaking_stops", "note": "A ceiling tile clips your arm, but Jay is under cover.", "text": "Reach out and pull Jay under your desk.", "effects": {"calm": -10, "health": -10}}, {"next": "shaking_stops", "chance": {"win": "shaking_stops", "loseEffects": {"calm": -15}, "lose": "shaking_stops", "winNote": "Jay snaps out of it and ducks under his own desk just in time.", "p": 0.5, "loseNote": "Jay does not move. You watch the fixture fall near him and it is hard to look away."}, "text": "Shout at Jay to get down, but stay put."}, {"next": "shaking_stops", "text": "Hold on and keep your head down. Survive first.", "effects": {"calm": -10}}], "text": "Under the desk you can hear everything: books hitting the floor, a ceiling tile cracking, someone screaming. The desk skids across the room but you hold on tight.\n\nAcross the aisle, Jay is standing frozen with his hands over his ears. A light fixture swings above his head.", "fx": "quake"}}, "icon": "\ud83c\udfeb", "deathNode": "death", "lesson": "In an earthquake: Drop, Cover, and Hold On. Stay put until the shaking stops.", "disaster": "Earthquake"}, {"start": "start", "title": "Rising Water", "place": "Subway", "blurb": "Marlow Street Station. A storm has been raining for hours, and the tunnel is filling up.", "difficulty": "Medium", "id": "subway", "nodes": {"start": {"choices": [{"next": "stairs", "text": "Run up the stairs, against the water.", "effects": {"calm": -10}}, {"next": "intercom", "note": "A tired voice answers: \"Station control.\"", "text": "Press the emergency intercom and call for help.", "effects": {"calm": 5}}, {"text": "Walk toward the far end of the platform.", "next": "far_end"}, {"next": "train_roof", "text": "Climb onto the stalled train for a better view.", "effects": {"give": ["phone light"], "calm": -5}}], "text": "Evening rush hour. You are on the Line 4 platform at Marlow Street, soaked from the storm outside. The board flickers: SERVICE SUSPENDED.\n\nThen you notice the thin sheet of water spreading across the platform floor, and a roar from the staircase you came down. Brown water is pouring down the steps.", "fx": "flood"}, "street_ending": {"lesson": "Even six inches of moving water can knock you off your feet. Two feet can float a car. Turn around, do not drown.", "ending": {"kind": "survived", "title": "Above the Waterline"}, "text": "A firefighter drapes a blanket around your shoulders. You sit on the curb, soaked and shaking, watching the water pour into the station you left behind. You made it, and you will take the bus from now on.", "fx": "calm"}, "death": {"lesson": "Never enter floodwater or train tunnels. Floodwater hides debris and live electricity, and cannot be outswum.", "ending": {"kind": "died", "title": "Swept Under"}, "text": "The water, the dark, and the current were stronger than you. The underground station fills silently. It is one of the worst nights the city has ever had.", "fx": "dark"}, "hero_ending": {"lesson": "When it is safe, helping others during an evacuation saves more lives. Just never put yourself in the flood's path to do it.", "ending": {"kind": "hero", "title": "Nine Out of Exit C"}, "text": "You lean back into the shaft and haul up the next person, then the next. By the time the firefighters reach you, nine people have climbed out of Exit C because you refused to leave them behind.\n\nThe news calls it a miracle. You call it a team effort.", "fx": "calm"}, "hatch": {"choices": [{"next": "street", "chance": {"win": "street", "loseEffects": {"health": -15}, "lose": "street", "p": 0.6, "boost": 0.1, "boostItem": "belt"}, "text": "Push the hatch with your shoulder and shout for the others to help."}], "text": "At the top of the shaft is a heavy steel hatch, held shut by the pressure of the rain on the other side. Below you, water is rising. The people on the ladder are shoving against you.", "fx": "dark"}, "shaft": {"choices": [{"next": "hatch", "chance": {"win": "hatch", "loseEffects": {"health": -25}, "lose": "hatch", "winNote": "You catch the rung and haul yourself up.", "p": 0.55, "loseNote": "You slip and crash into the rungs, scraping both arms."}, "text": "Swing across to the next ladder and pull yourself up."}, {"next": "hatch", "requires": {"items": ["belt"]}, "text": "Use the belt to bind the broken rung.", "note": "It holds, barely."}, {"next": "death", "note": "The rung gives way.", "text": "Keep climbing on the damaged ladder.", "effects": {"health": -100}}], "text": "The ladder climbs for what feels like forever. Halfway up, the one above you freezes. The rung is rusted through and swinging loose. The water is rising right behind you.", "fx": "dark"}, "washed_back": {"choices": [{"next": "far_end", "text": "Follow her to the far end.", "effects": {"calm": -5}}], "text": "The water carries you back down the stairs and dumps you on the platform. You cough and gasp. Water is now ankle-deep and rising fast. A stranger hauls you to your feet. \"The ladder to the maintenance shaft!\" she shouts, pointing down the platform.", "fx": "flood"}, "tunnel": {"choices": [{"next": "far_end", "note": "You scramble up, heart pounding.", "text": "Climb back to the platform. Do not touch the rails.", "effects": {"calm": -15, "health": -15}}, {"next": "death", "note": "The water carries the current.", "text": "Wade past the rail, hugging the wall.", "effects": {"health": -100}}], "text": "You drop onto the tracks. It is pitch black and the water is already at your shins. You feel the metal of the rail brush your foot. Is power still on?\n\nA flicker of sparks lights the tunnel. The third rail is half-submerged ahead of you.", "fx": "dark"}, "intercom": {"choices": [{"next": "far_end", "note": "He leans on your arm. \"Thank you, kid.\"", "text": "Help the elderly man walk toward Exit C.", "effects": {"set": ["helped_stranger"], "calm": 5}}, {"next": "far_end", "text": "Head to Exit C alone. You cannot carry everyone.", "effects": {"calm": -10}}, {"next": "tunnel", "text": "Jump down to the tracks and run through the tunnel.", "effects": {"calm": -10}}], "text": "\"Station control. Marlow Street is flooding. We are evacuating via Exit C at the far end. Do NOT use the tracks. The rails are live until we cut power.\"\n\nThe voice cuts out. Water laps at the platform edge. Behind you, an elderly man with a cane is struggling to stay upright against the flow.", "fx": "flood"}, "street": {"choices": [{"next": "hero_ending", "requires": {"flags": ["helped_child"]}, "text": "Help pull up the next person from the shaft.", "hiddenIfLocked": true}, {"next": "hero_ending", "requires": {"flags": ["helped_stranger"]}, "text": "Look around for who is still down there.", "hiddenIfLocked": true}, {"text": "Collapse on the sidewalk and let the firefighters take over.", "next": "street_ending"}], "text": "The hatch bursts open and cold air and rain hit your face. You climb out onto a raised sidewalk. The street below is a river. Firefighters in orange suits are wading toward you with ropes.", "fx": "calm"}, "stairs": {"choices": [{"next": "stairs_hold", "chance": {"win": "stairs_hold", "p": 0.6, "lose": "washed_back", "loseEffects": {"health": -30}}, "text": "Grab the handrail with both hands and hold on.", "note": "Your grip is slipping..."}, {"next": "washed_back", "text": "Let go and swim for the platform.", "effects": {"health": -30}}], "text": "Halfway up, the water hits your knees and shoves you backward. A man grabs the rail beside you and shouts that the street is flooded too. It is knee-deep and brown, and it is full of debris.\n\nYou slip. The current drags your legs out from under you.", "fx": "flood"}, "far_end": {"choices": [{"next": "shaft", "note": "The mother sobs thanks as you boost her kid up.", "text": "Lift the toddler onto the ladder first.", "effects": {"set": ["helped_child"], "health": -10, "calm": 5}}, {"next": "shaft", "note": "Others shout at you, but you are up the ladder.", "text": "Push to the front. You need to get out now.", "effects": {"calm": -15}}, {"hiddenIfLocked": true, "next": "shaft", "requires": {"items": ["knife"]}, "text": "Cut a strap from a bag with your knife for a rope.", "effects": {"calm": 5, "give": ["belt"]}}, {"next": "shaft", "note": "You pull a strap from a bag.", "text": "Look for something to use as a rope.", "effects": {"give": ["belt"]}}], "text": "At the far end of the platform, a steel door marked EXIT C hangs open. Beyond it a metal ladder climbs into a dark maintenance shaft. Water is up to your thighs and surging.\n\nA small group is already there. A girl with a toddler cannot reach the first rung.", "fx": "flood"}, "boat_rescue": {"lesson": "If you cannot get out, go to the highest dry point and signal clearly for help. Do not try to move through fast-moving water.", "ending": {"kind": "survived", "title": "Rescued by Boat"}, "text": "A rescue boat finds you at last. You wait on the roof as the rescuers pull people up one by one. When the boat reaches the ladder, you climb in. It is only when you are out in the open air that you realise how dangerous that tunnel was.", "fx": "calm"}, "stairs_hold": {"choices": [{"next": "intercom", "text": "Go back down and use the intercom.", "effects": {"calm": -10, "health": -10}}, {"next": "far_end", "text": "Head for the far end of the platform.", "effects": {"health": -10}}], "text": "You hold on. The man from the stairs hauls you up by your jacket and together you cling to the rail until the surge passes. But the street exit is under a meter of water. You cannot go out that way.", "fx": "flood"}, "wait_roof": {"choices": [{"next": "boat_rescue", "requires": {"items": ["phone light"]}, "text": "Shout for help and wave your phone light."}, {"next": "far_end", "note": "The water is freezing and fast.", "text": "Jump down and swim for the ladder.", "effects": {"calm": -10, "health": -25}}], "text": "Twenty minutes pass. The water climbs until it laps at the underside of the train carriage. The roof begins to shake as the current rocks the train. Your teeth are chattering.", "fx": "flood"}, "train_roof": {"choices": [{"next": "far_end", "text": "Jump back down and run for the ladder at the far end.", "effects": {"calm": -5}}, {"text": "Stay on the roof and wait for rescue.", "next": "wait_roof"}], "text": "You pull yourself up onto the roof of the train. From here you can see the whole platform: the water has swallowed the benches and is already above the first rung of the maintenance ladder at the far end. Others on the platform are screaming for help.\n\nThe water keeps rising. The roof of the train will not stay above it for long.", "fx": "flood"}}, "icon": "\ud83d\ude87", "deathNode": "death", "lesson": "Floodwater is faster and stronger than it looks. Move up and away, never through it.", "disaster": "Flash Flood"}, {"start": "start", "title": "Ember Night", "place": "Campsite", "blurb": "Pine Lake Campground. Dry winds, an orange glow on the ridge, and one road out.", "difficulty": "Hard", "id": "wildfire", "nodes": {"start": {"choices": [{"next": "road", "text": "Leave right now. Grab the car keys and go.", "effects": {"calm": -5}}, {"next": "packing", "text": "Pack the tents and gear first, then go.", "effects": {"calm": -5}}, {"next": "ridge", "text": "Check the fire first. Climb the ridge for a view.", "effects": {"calm": -5}}], "text": "Day three of the camping trip. You, your friends Dani and Leo, and your older cousin Remy are playing cards when you notice the smell: smoke, thick and sharp. The sky to the west has turned a dirty orange.\n\nA ranger truck rolls through the campground with a loudspeaker: \"Evacuation order. Leave now by the south road.\"", "fx": "fire"}, "lake": {"choices": [{"hiddenIfLocked": true, "next": "lake_night", "requires": {"items": ["water"]}, "text": "Soak your shirt with your water bottle first, then wade in.", "effects": {"health": 10, "calm": 10, "give": ["wet cloth"]}}, {"next": "lake_night", "text": "Wet your shirt and breathe through it.", "effects": {"calm": 5, "give": ["wet cloth"]}}, {"next": "lake_night", "text": "Duck under whenever the heat surges.", "effects": {"health": -5, "calm": -5}}, {"next": "far_shore", "text": "Swim across to the far shore, away from the fire.", "effects": {"calm": -10}}], "text": "The lake is cool and black and calm. You wade in up to your neck. Behind you the campsite is a wall of flame. Heat scorches your back, and the air is thick with smoke. A bandana and a water bottle would be good right now.", "fx": "fire"}, "helicopter": {"lesson": "Bodies of water and bare ground can protect you when the fire front passes. Stay low, cover your face, and signal clearly for rescue.", "ending": {"kind": "survived", "title": "Lifted from the Lake"}, "text": "The helicopter circles, then drops a line. Crews haul out each survivor on the beach and fly you to a safe zone. At the evacuation centre, you find Dani, Leo and Remy, all of them safe. All the gear is gone, but you do not care.", "fx": "calm"}, "packing": {"choices": [{"next": "road", "note": "You leave the tents burning behind you.", "text": "Drop everything and get in the car.", "effects": {"health": -5, "calm": -10}}, {"next": "trapped_camp", "text": "Keep packing. It is expensive gear.", "effects": {"calm": -15}}], "text": "Packing a tent takes longer than you think. Ten minutes later, the wind shifts and embers begin to fall around the campsite. Remy is shouting from the car. Dani is trying to roll up a sleeping bag with shaking hands.", "fx": "fire"}, "late_rescue": {"lesson": "A bright, visible signal helps rescuers find you quickly. Do not rely on being noticed.", "ending": {"kind": "survived", "title": "Long Wait"}, "text": "The chopper does not see you. You wait through the smoke-filled day, shivering in the water, until a ground crew finds you at dusk. You will have lung problems for months, but you are alive.", "fx": "calm"}, "death": {"lesson": "Most wildfire deaths happen when people delay leaving. Leave as soon as an evacuation order is issued.", "ending": {"kind": "died", "title": "Lost to the Fire"}, "text": "The fire moved faster than anyone could believe. Smoke, heat and panic closed every door. The park will rebuild, but you will not forget this night.", "fx": "dark"}, "push_truck": {"choices": [{"next": "convoy", "text": "Jump back in and race out with the convoy.", "effects": {"set": ["cleared_road"], "health": -10}}], "text": "You and Leo run to the truck. Together with three other people, you shove it into the ditch, bumper first. The line of cars lurches forward. Smoke stings your eyes and the heat is intense, but the road is clear.", "fx": "fire"}, "trapped_camp": {"choices": [{"next": "lake", "text": "Sprint for the lake.", "effects": {"calm": -20, "health": -35}}], "text": "Ten more minutes and the wind shifts for the worst. A fireball roars into the campground. You flee on foot with nothing, and the car is blocked by burning trees.\n\nYou see the lake, a hundred metres away, glittering orange. It is your last chance.", "fx": "fire"}, "convoy": {"lesson": "Evacuating early by the designated route, and helping clear the way, can save a whole convoy. Always follow official evacuation orders.", "ending": {"kind": "hero", "title": "Cleared the Road"}, "text": "The convoy crawls through the smoke, tail lights in front of you glowing like embers. The air inside the car is hot. Then the trees thin out and you reach an open meadow, and a fire crew with water trucks waving cars through.", "fx": "fire"}, "far_shore": {"choices": [{"next": "lake_night", "text": "Help the family into the water and keep them calm.", "effects": {"set": ["helped_family"], "health": -10, "calm": -5}}, {"next": "lake_night", "text": "Collapse on the sand and rest.", "effects": {"calm": 10}}], "text": "The swim is long, and the cold bites hard. On the far shore, a pebble beach with no trees nearby, a family has already gathered, huddled in towels. A little boy is crying, and a woman waves at you.", "fx": "fire"}, "lake_night": {"choices": [{"next": "helicopter", "requires": {"items": ["wet cloth"]}, "text": "Wave your wet shirt, spread wide on the sand."}, {"next": "helicopter", "chance": {"win": "helicopter", "p": 0.7, "lose": "late_rescue"}, "text": "Wave your arms and shout."}], "text": "The hours pass. The fire front sweeps by, leaving black skeletons of trees. Burning branches fall into the lake with a hiss. The air stays thick with smoke, but the water protects you.\n\nAt first light you hear a chopper.", "fx": "fire"}, "ridge": {"choices": [{"next": "road", "text": "Yell: \"Car, now! The road is the only way!\"", "effects": {"health": -10, "calm": -15}}, {"next": "lake", "text": "Shout: \"Fire's too close, head for the lake!\"", "effects": {"calm": -10}}], "text": "From the ridge, you see it: a wall of fire racing across the hillside toward the campground and the road. It is moving far faster than you expected, and the wind is pushing it straight at you. You can hear it, like a freight train.\n\nYou run back to camp. Everyone is staring at you.", "fx": "fire"}, "road": {"choices": [{"next": "car_wait", "text": "Stay in the car, close the vents, and wait it out.", "effects": {"calm": -10}}, {"next": "lake", "text": "Abandon the car and run back to the lake.", "effects": {"calm": -15, "health": -15}}, {"next": "push_truck", "text": "Help the stalled driver push the truck off the road.", "effects": {"calm": -5}}], "text": "You pile into Remy's car. The south road is a single lane of gravel through the pines. Within a mile, you hit a line of brake lights. A truck has broken down ahead, and smoke is rolling across the road. Behind you, flames are leaping from tree to tree.", "fx": "fire"}, "car_wait": {"choices": [{"next": "lake", "text": "Run for the lake on the far side of the field.", "effects": {"calm": -10, "health": -20}}, {"next": "death", "note": "The cars cannot withstand the fire front.", "text": "Stay put. The car is a metal box.", "effects": {"health": -100}}], "text": "Heat shimmers on the windscreen. You can hear the fire crackling closer. Someone shouts that you have to get out of the cars. Then the front-most car's tyre bursts from the heat.", "fx": "fire"}}, "icon": "\ud83d\udd25", "deathNode": "death", "lesson": "Wildfires move faster than you can run. Leave early, and choose a route away from fuel.", "disaster": "Wildfire"}, {"start": "start", "title": "The Sea Pulls Back", "place": "Beach Resort", "blurb": "Sunny morning on the beach. The ground shakes for a full minute, and then the ocean disappears.", "difficulty": "Medium", "id": "tsunami", "nodes": {"start": {"choices": [{"next": "inland", "text": "Grab Mia and head inland, uphill. Now.", "effects": {"set": ["has_mia"], "calm": -5}}, {"text": "Ask a lifeguard what is going on.", "next": "lifeguard"}, {"text": "Stay and wait for an official announcement.", "next": "wait"}], "text": "You are on a sunbed outside the Palm Bay Resort with your little sister Mia, sipping a fruit drink, when the ground begins to roll. A glass shatters. Palm trees sway. The shaking lasts almost a full minute.\n\nWhen it stops, people laugh nervously and start filming. Mia grins: \"That was cool!\"", "fx": "calm"}, "hilltop": {"choices": [{"next": "hero_ending", "requires": {"flags": ["has_mia"]}, "text": "Help organise the group and share your phone's signal.", "hiddenIfLocked": true}, {"text": "Sit with Mia and wait for news.", "next": "hilltop_ending"}], "text": "You reach the top of the hill, where dozens of survivors stand looking down at the bay. The resort is gone. The sea is brown and full of wreckage. Mia clings to your side.\n\nA man near you is searching the crowd and shouting a name over and over.", "fx": "calm"}, "hilltop_late": {"choices": [{"next": "hilltop", "text": "Scramble up the slope.", "effects": {"health": -15}}], "text": "You look back and see the resort vanish into brown water. The hotel's ground floor is gone. A second wave rolls in, higher than the first, and its spray soaks you. The local man drags you up the slope by the shoulder.", "fx": "wave"}, "inland": {"choices": [{"next": "footpath", "text": "Leave the road and take the steep footpath uphill.", "effects": {"calm": -5, "health": -10}}, {"next": "car_trap", "text": "Hop into a stranger's car crawling in traffic.", "effects": {"calm": -5}}, {"next": "hotel", "requires": {"flags": ["has_mia"]}, "text": "Carry Mia on your back and sprint for the hotel instead.", "effects": {"calm": -10, "health": -10}}], "text": "The coastal road is already jammed with cars. Horns, shouting, a motorbike on the pavement. Mia is panting but keeps up. The hill is a few hundred metres ahead. You can hear a deep roar from the beach, like a river.", "fx": "wave"}, "hero_ending": {"lesson": "Acting on natural warning signs, rather than waiting for official alerts, gives you and the people around you the best chance.", "ending": {"kind": "hero", "title": "Higher Ground, Together"}, "text": "You and a few others set up a list of names on the back of a map. Phones come back on one by one. By evening, you have reconnected eleven families. Mia hands out water bottles to the children.\n\nThe local news interviews you at the evacuation centre. \"I just ran,\" you say. \"And I made sure she ran too.\"", "fx": "calm"}, "hilltop_ending": {"lesson": "Move inland and uphill as soon as you feel a strong earthquake. A tsunami can reach shore in minutes.", "ending": {"kind": "survived", "title": "Above the Wave"}, "text": "You sit with Mia, wrapped in a stranger's blanket, until the sun goes down. Rescue crews arrive. You are alive, and so is she. The beach is gone, but you have each other.", "fx": "calm"}, "room": {"choices": [{"next": "hotel", "text": "Drop the bag and run for the hotel stairs.", "effects": {"health": -10, "calm": -20}}, {"next": "inland", "text": "Run uphill. The road is closer to you than the hotel.", "effects": {"health": -10, "calm": -20}}], "text": "You race to your ground-floor room. The door is jammed from the quake and you waste minutes forcing it open. When you finally get out with your bag, the beach is deserted except for one thing: far out where the sea used to be, a long white line is rising on the horizon.", "fx": "calm"}, "death": {"lesson": "A receding sea is a tsunami warning. Never go to look at it. Run uphill.", "ending": {"kind": "died", "title": "Swept Away"}, "text": "The wave came faster than anyone could believe. By the time you understood the signs, it was too late. Palm Bay will be remembered as a place where the warning came from the earth itself.", "fx": "dark"}, "roof_ending": {"lesson": "If you cannot reach high ground, go to the upper floors of a strong concrete building (at least 4 storeys up). Tsunamis come in several waves, so stay put until officials say it is safe.", "ending": {"kind": "survived", "title": "Vertical Evacuation"}, "text": "Waves come in for hours. Rescue helicopters pick up survivors from the roof the next morning. The elderly woman, if you helped her, holds your hand tight on the flight out. Mia is quiet. Then she says: \"We should have listened to the ground.\"\n\nShe is right.", "fx": "calm"}, "roof": {"choices": [{"text": "Hold Mia tight and wait for rescue. More waves could come.", "next": "roof_ending"}], "text": "On the roof of the resort, dozens of people are huddled together. Below, the wave crashes into the lower floors with a thunderous boom and the whole building shudders. Water surges through the lobby. The sea keeps rising for what feels like forever, then begins to drain.\n\nYou hold Mia tight and do not look down.", "fx": "wave"}, "seabed": {"choices": [{"next": "death", "chance": {"win": "hotel", "p": 0.1, "lose": "death"}, "text": "Run for the hotel as fast as you can.", "note": "It is too far..."}], "text": "The sand is hard and wet and littered with stranded fish. You are fifty metres out when you hear screaming behind you. You turn around. A wall of water is racing across the bay, filled with boats, trees, and the remains of the pier.", "fx": "wave"}, "car_trap": {"choices": [{"next": "footpath", "chance": {"win": "footpath", "p": 0.5, "lose": "death", "loseEffects": {"health": -60}}, "text": "Jump out, grab Mia, and scramble up the embankment.", "effects": {"calm": -15}}], "text": "The car does not move. Traffic is solid. Behind you, the sea is a grey wall rushing through the streets. The driver is frozen.", "fx": "wave"}, "wait": {"choices": [{"next": "inland", "note": "You grab Mia's hand and sprint.", "text": "Run. This is the warning sign.", "effects": {"set": ["has_mia"], "calm": -15}}, {"next": "seabed", "text": "Walk out onto the seabed to see for yourself.", "effects": {"calm": -5}}], "text": "Five minutes pass. No sirens. Phones have no signal. A boy near you points at the water: \"Look! The sea is going out!\" Fish are flopping on the exposed sand, and the water has retreated hundreds of metres.\n\nPeople are walking out onto the wet seabed to take photos.", "fx": "calm"}, "hotel": {"choices": [{"next": "roof", "text": "Help her up the stairs, one step at a time.", "effects": {"set": ["helped_woman"], "calm": -5, "health": -10}}, {"next": "roof", "text": "Keep climbing. The wave is coming.", "effects": {"calm": -10}}, {"hiddenIfLocked": true, "next": "roof", "requires": {"items": ["food"]}, "text": "Eat your snack bar for energy and carry her up.", "effects": {"set": ["helped_woman"], "calm": 5}}, {"next": "death", "note": "The wave tops three storeys.", "text": "Stop at the third floor. That is high enough.", "effects": {"health": -100}}], "text": "The Palm Bay is a concrete building, eight storeys tall. The stairwell is packed. On the third floor, an elderly woman has sat down on the landing, unable to climb further.", "fx": "wave"}, "footpath": {"choices": [{"next": "hilltop", "text": "Keep climbing. Higher, higher.", "effects": {"health": -5}}, {"next": "hilltop_late", "text": "Stop and look back to see how bad it is.", "effects": {"calm": -10}}], "text": "The path is muddy and steep. Mia's sandals slide. You boost her up by the arms while a local man reaches down from above. The roar rises behind you. Water surges up the lower slope, swallowing the road and the car park.", "fx": "wave"}, "lifeguard": {"choices": [{"next": "inland", "text": "Grab Mia and run up the hill road.", "effects": {"set": ["has_mia"], "calm": -5}}, {"next": "hotel", "text": "Take Mia into the hotel and go up the stairs.", "effects": {"set": ["has_mia"], "calm": -5}}, {"next": "room", "text": "Run back to your room to grab your passport and phone.", "effects": {"calm": -10}}], "text": "The lifeguard is already on the radio. \"Strong quake. Possible tsunami. Everyone to high ground, up the hill past the road or to the upper floors of the hotel. Go now. Do not wait for the siren.\"", "fx": "calm"}}, "icon": "\ud83c\udf0a", "deathNode": "death", "lesson": "Strong shaking near the coast, or the sea suddenly draining away, is the warning. Do not wait for a siren.", "disaster": "Tsunami"}, {"start": "start", "title": "Dead Hours", "place": "Apartment Block", "blurb": "Day one of the outbreak. Third floor, one locked door, and something is pounding on it.", "difficulty": "Hard", "id": "zombies", "nodes": {"plan": {"choices": [{"next": "stairs", "text": "Head for Harbor Pier.", "effects": {"set": ["goal_harbor"]}}, {"next": "stairs", "text": "Head for Hartley Tower.", "effects": {"set": ["goal_tower"]}}], "text": "While searching, your portable radio crackles. \"...Harbor Pier. Boats at dawn. Helicopters from Hartley Tower roof, last flight at noon. All other routes are unsafe...\" You have to pick one.", "fx": "dark"}, "fire_escape": {"choices": [{"next": "alley", "chance": {"win": "alley", "loseEffects": {"health": -25}, "lose": "alley", "p": 0.6, "loseNote": "A rung gives way and you tumble the last few metres."}, "text": "Climb down into the alley.", "effects": {"calm": -10, "health": -5}}, {"next": "roof", "text": "Climb up to the roof.", "effects": {"calm": 5}}], "text": "The iron fire escape clangs in the wind. Below, an alley full of dumpsters and wandering shapes. Above, a ladder leads to the roof of the building. Someone up there is waving a torch.", "fx": "dark"}, "alley": {"choices": [{"hiddenIfLocked": true, "next": "pier", "requires": {"notFlags": ["goal_tower"], "items": ["food"]}, "text": "Eat your food, then sprint the whole way to the Pier.", "effects": {"calm": 5}}, {"hiddenIfLocked": true, "next": "pier", "chance": {"win": "pier", "p": 0.55, "lose": "death", "loseEffects": {"health": -70}}, "text": "Dash between wrecked cars toward the Pier.", "requires": {"notFlags": ["goal_tower"]}}, {"hiddenIfLocked": true, "next": "tower", "requires": {"flags": ["goal_tower"], "items": ["food"]}, "text": "Eat your food, then sprint the whole way to Hartley Tower.", "effects": {"calm": 5}}, {"hiddenIfLocked": true, "next": "tower", "chance": {"win": "tower", "p": 0.55, "lose": "death", "loseEffects": {"health": -70}}, "text": "Dash between wrecked cars toward Hartley Tower.", "requires": {"flags": ["goal_tower"]}}], "text": "The alley opens onto the main road. Straight ahead the city is a maze of burning cars and wandering silhouettes. You can see your goal in the distance. It is a long way.", "fx": "dark"}, "heli": {"choices": [{"next": "hero_roof", "text": "Carry Theo's dad up the ladder.", "effects": {"calm": -10, "health": -15}}, {"text": "Climb up yourself while you can.", "next": "heli_ending"}], "text": "The helicopter drops a rope ladder. There is only room for a few. Theo's dad cannot climb alone.", "fx": "calm"}, "safe_ending": {"lesson": "Sheltering in place only works if you have supplies. Food, water and a plan make waiting survivable.", "ending": {"kind": "survived", "title": "The Long Siege"}, "text": "You sip the last water and wait. On the fourth day, soldiers go door to door with loudhailers, clearing each building. They knock on your barricade and call out: \"Anyone alive in there? We are evacuating survivors.\"\n\nYou answer, your voice cracking.", "fx": "calm"}, "hero_pier": {"lesson": "Teamwork and compassion keep communities alive after a collapse. Survivors who cooperate do better than those who go alone.", "ending": {"kind": "hero", "title": "The Last Boat"}, "text": "You shout to the soldier at the gangway and wave the family forward. For a moment it looks like the barricade will break. Then the children are lifted aboard, and you follow. As the boat pulls away, the little girl hands you her stuffed rabbit.", "fx": "calm"}, "roof": {"choices": [{"next": "heli", "chance": {"win": "heli", "loseEffects": {"calm": -15}, "lose": "heli", "winNote": "The pilot sees you at once.", "p": 0.65, "loseNote": "It circles twice before it notices you."}, "text": "Signal the helicopter with a bright flare."}, {"note": "Theo manages a smile.", "hiddenIfLocked": true, "next": "heli", "requires": {"items": ["food"]}, "text": "Share your food with Theo and his dad first.", "effects": {"set": ["helped_theo"], "take": ["food"], "calm": 10}}], "text": "On the roof, a handful of survivors huddle around a flare. A man is lying injured by the air vent and his teenage son Theo is holding his hand. A distant thudding grows louder. A helicopter, circling in the dark.", "fx": "calm"}, "tower": {"choices": [{"next": "roof", "text": "Keep climbing, one landing at a time.", "effects": {"health": -5, "calm": -10}}], "text": "Hartley Tower's lobby is dark and the lifts are dead. The sign on the wall reads ROOF ACCESS - FLOOR 22. You take the emergency stairs, floor by floor, listening for movement above and below. Your legs burn.", "fx": "dark"}, "start": {"choices": [{"next": "peep", "text": "Look through the peephole.", "effects": {"calm": -5}}, {"next": "barricade", "text": "Shove the sofa against the door.", "effects": {"calm": 5}}, {"next": "stairs", "text": "Grab your bag and run for the stairwell.", "effects": {"calm": -15}}], "text": "You wake to screaming. Not from the TV, from the corridor. Through the wall you hear glass breaking, a door slamming, and a wet, wrong sound you cannot place. Your phone shows forty missed alerts: ATTACKS REPORTED. STAY INDOORS. DO NOT APPROACH THE INFECTED.\n\nSomeone is thumping on your front door, slowly, over and over.", "fx": "dark"}, "heli_ending": {"lesson": "Make yourself visible and wait for official rescue. Never rely only on being noticed.", "ending": {"kind": "survived", "title": "Airlifted Out"}, "text": "You are hauled up into the helicopter and strapped in. The roof falls away beneath you and the city stretches out like a map of fire. You are alive. You try not to look back.", "fx": "calm"}, "death": {"lesson": "Panic and rushing are the biggest killers in any crisis. Stay calm, move deliberately, and keep supplies ready.", "ending": {"kind": "died", "title": "Overrun"}, "text": "The city falls silent. In the end it was the crowd, the dark, and the bite you could not stop. Maybe someone on the next block will hold out a little longer.", "fx": "dark"}, "hero_roof": {"lesson": "Putting others first is not just noble, it builds the trust and bonds that get people through disasters.", "ending": {"kind": "hero", "title": "Rooftop Rescue"}, "text": "You strap Theo's dad to your back and climb, step by step, with the rotor wash tearing at your clothes. When you pull him inside, Theo hugs you so hard you can barely breathe. \"I do not know your name,\" he says. \"But I will never forget it.\"", "fx": "calm"}, "barricade": {"choices": [{"next": "plan", "note": "You find a heavy cast-iron pan.", "text": "Search the kitchen for anything useful.", "effects": {"calm": 5, "give": ["pan"]}}, {"text": "Check the fire escape outside the bedroom window.", "next": "fire_escape"}, {"next": "siege", "text": "Raid the fridge and cupboards, then hunker down and wait for rescue.", "effects": {"calm": -5, "give": ["food"]}}, {"next": "siege", "text": "Hunker down with what you have and wait for rescue.", "effects": {"calm": -5}}], "text": "The sofa, the table and the bookcase make a decent wall. Whatever is outside keeps pounding, then slowly loses interest and shuffles off. It is quiet. Too quiet.\n\nYour stomach growls. You have maybe three days of food in the flat. Outside the window, smoke rises over the city.", "fx": "dark"}, "street": {"choices": [{"next": "alley", "chance": {"win": "alley", "loseEffects": {"calm": -15, "health": -20}, "lose": "alley", "winNote": "The engine catches and you roar away.", "p": 0.5, "loseNote": "It stalls. You bolt on foot as the shapes close in."}, "text": "Try the car. It is the fastest way across the city."}, {"next": "alley", "text": "Slip into the back alleys on foot.", "effects": {"calm": -5}}], "text": "The lobby doors burst open onto an empty street. Cars are abandoned with their doors hanging open. A figure drags itself across the road. A car sits with its keys still in the ignition, engine ticking.", "fx": "dark"}, "stairs": {"choices": [{"note": "You are fast and decisive, and the stairs are clear.", "hiddenIfLocked": true, "next": "street", "requires": {"items": ["knife"]}, "text": "Fight through with your knife.", "effects": {"calm": 5, "health": -10}}, {"hiddenIfLocked": true, "next": "street", "requires": {"items": ["pan"]}, "text": "Swing the pan at the first one.", "chance": {"win": "street", "loseEffects": {"calm": -15, "health": -35}, "lose": "street", "winNote": "The pan connects with a clang and you push through.", "p": 0.5, "loseNote": "One of them grabs your arm and tears your sleeve before you break free."}}, {"next": "street", "chance": {"win": "street", "loseEffects": {"calm": -20, "health": -30}, "lose": "street", "winNote": "They shuffle right past without noticing you.", "p": 0.4, "loseNote": "A step creaks. You sprint down with them on your heels."}, "text": "Sneak past them, one step at a time."}], "text": "The stairwell is dark. A body in a hoodie lies slumped on the landing. It lifts its head. Further down, two more shapes shuffle toward you, drawn by the noise.\n\nThere is no other way down.", "fx": "dark"}, "peep": {"choices": [{"next": "barricade", "chance": {"win": "barricade", "loseEffects": {"calm": -20, "health": -45}, "lose": "barricade", "winNote": "She stumbles past you into the stairwell. You slam the door.", "p": 0.15, "loseNote": "She lunges and bites your forearm before you can shut the door."}, "text": "Open it. Maybe she just needs help."}, {"next": "barricade", "text": "Stay silent and back away.", "effects": {"calm": -5}}, {"text": "Call your mum on the phone.", "next": "phone"}], "text": "It is Mrs. Alvarez from 3C, the neighbour who feeds the cat. Her eyes are grey and her mouth is dark with blood. She does not blink. She keeps hitting the door with an open hand.", "fx": "dark"}, "phone": {"choices": [{"next": "barricade", "text": "Write both places down and push the sofa against the door.", "effects": {"calm": 5}}], "text": "Your mum picks up on the first ring. \"Listen. The radio says boats leave from Harbor Pier at dawn, and helicopters are taking people off the roof of Hartley Tower. I am at your aunt's. Do NOT come here. Get to one of them. Please.\"\n\nThe line cuts out.", "fx": "dark"}, "boat_ending": {"lesson": "Evacuating early to a planned location, with supplies, is the best way out of any large-scale emergency.", "ending": {"kind": "survived", "title": "Off the Pier"}, "text": "You squeeze onto the deck as the engines roar. Behind you, the city burns. A medic hands you a blanket and a bottle of water, and for the first time in two days you let yourself breathe.", "fx": "calm"}, "pier": {"choices": [{"next": "hero_pier", "text": "Help the family reach the front of the line.", "effects": {"calm": -5, "health": -10}}, {"text": "Get on the boat. You earned your place.", "next": "boat_ending"}], "text": "Harbor Pier is a wall of floodlights and rifles. Soldiers hold back the infected at a barricade while boats take on passengers one by one. A family with two small children is stuck at the back of the line, pushed aside by the crowd.", "fx": "calm"}, "siege": {"choices": [{"hiddenIfLocked": true, "next": "safe_ending", "requires": {"items": ["food"]}, "text": "Ration your food and wait one more day.", "effects": {"calm": 10}}, {"next": "stairs", "text": "Go out now and flag the convoy down.", "effects": {"calm": -10, "health": -10}}, {"next": "death", "note": "No one comes in time.", "text": "Keep waiting. They will come.", "effects": {"health": -100}}], "text": "Day three. The pounding has stopped, but now it is the silence that hurts. Your food is nearly gone and the tap runs brown. Somewhere far off, an engine rumbles, a military convoy, you think. It is passing by your street.", "fx": "dark"}}, "icon": "\ud83e\udddf", "deathNode": "death", "lesson": "In any crisis: stay quiet, secure your space, gather food and water, and move only with a plan.", "disaster": "Zombie Outbreak"}, {"start": "start", "title": "Flash Warning", "place": "Office Tower", "blurb": "Every phone in the office screams at once: missile inbound. You have minutes.", "difficulty": "Hard", "id": "nuclear", "nodes": {"start": {"choices": [{"next": "doubt", "text": "Check the news first. It might be a false alarm.", "effects": {"calm": -5}}, {"next": "shelter_choice", "text": "Head to the lower floors and basement right now.", "effects": {"calm": -5}}, {"next": "car", "text": "Run to your car. You need to get home to your family.", "effects": {"calm": -10}}, {"next": "window", "text": "Go to the window to look for the missile.", "effects": {"calm": -5}}], "text": "Tuesday, 10:14 a.m. Your office floor is full of keyboards clicking until every phone in the building shrieks at the same moment. The screen reads: BALLISTIC MISSILE THREAT INBOUND. SEEK IMMEDIATE SHELTER. THIS IS NOT A DRILL.\n\nPeople freeze, then split. Someone is shouting that it is a mistake. Someone else is already running for the doors.", "fx": "calm"}, "window": {"choices": [{"next": "shelter_choice", "note": "You are blinded and cut by glass, but alive.", "text": "Drop to the floor and crawl for the stairs.", "effects": {"calm": -25, "health": -35}}], "text": "You press your face to the glass. For a second you see nothing: the grey sky, the city. Then a light brighter than the sun swallows the horizon. Your eyes burn. The window shatters inward.", "fx": "dark"}, "doubt": {"choices": [{"next": "shelter_choice", "text": "Go to the basement. Now.", "effects": {"calm": -10}}], "text": "The radio on the break room shelf confirms it: a real attack, a real warning. You lost two minutes you might not have. Every second counts now.", "fx": "calm"}, "basement": {"choices": [{"next": "post_blast", "note": "Behind a box you find a battery radio.", "text": "Feel around the shelves for supplies.", "effects": {"calm": 5, "give": ["radio"]}}, {"next": "post_blast", "text": "Sit tight and conserve energy.", "effects": {"calm": 5}}], "text": "The utility room is windowless and thick-walled. Pipes drip. You pull the door shut as the first tremor rolls through the building. Concrete dust trickles from the ceiling. Then a deep, endless roar, and the whole structure shudders.\n\nWhen it stops, the lights flicker out. In the dark you can hear your own breathing, and Mira's.", "fx": "dark"}, "post_blast": {"choices": [{"next": "wait", "text": "Stay inside. Wait for official word.", "effects": {"calm": -5}}, {"next": "outside", "text": "Go upstairs to see what happened.", "effects": {"calm": -10}}], "text": "Hours pass. The building groans but holds. Your head is ringing. Someone above is pounding on a pipe, an echo of something terrible. The dust is thick.\n\nThe urge to go up and look is almost unbearable.", "fx": "dark"}, "car": {"choices": [{"next": "shelter_choice", "text": "Abandon the car and run back inside to shelter.", "effects": {"health": -10, "calm": -15}}, {"next": "death", "note": "A car offers almost no protection.", "text": "Stay in the car and hope the traffic clears.", "effects": {"health": -100}}, {"next": "death", "note": "There is not enough time.", "text": "Run for the highway on foot.", "effects": {"health": -100}}], "text": "The car park is chaos. The street outside is a solid wall of brake lights and horns. Nobody is going anywhere. A car window is a thin barrier against blast and radiation.", "fx": "dark"}, "death": {"lesson": "Civil-defence advice is blunt for a reason: get inside the nearest sturdy building immediately, move away from windows, and do not go outside until told it is safe.", "ending": {"kind": "died", "title": "Too Late"}, "text": "There was never going to be enough time. A few minutes, and one wrong turn, made all the difference. Cities will rebuild, but you are not there to see it.", "fx": "dark"}, "shelter_choice": {"choices": [{"next": "basement", "note": "Mira gives a small nod and follows.", "text": "Take Mira's hand and bring her with you to the utility room.", "effects": {"set": ["helped_mira"], "calm": -5}}, {"text": "Go straight to the utility room.", "next": "basement"}, {"next": "death", "note": "The car park is too exposed.", "text": "Stay in the car park, close to the exit.", "effects": {"health": -100}}], "text": "The stairwell echoes with feet. At the basement level, a heavy door stands open onto an underground car park. Two options: a concrete utility room deep in the building, or the open car park with its thin walls.\n\nIn the corridor, Mira from accounting is paralysed with fear, hands over her face.", "fx": "dark"}, "hero_ending": {"lesson": "Bringing others to shelter, and sharing the right information, saves more lives than acting alone.", "ending": {"kind": "hero", "title": "Stay Tuned"}, "text": "You and Mira lead six others from the building, calling out for stragglers on the way. At the evacuation centre, the medic asks how you knew to stay in the basement. \"Get inside, stay inside, stay tuned,\" you say. \"Then help whoever you can.\"", "fx": "calm"}, "rescue_sick": {"lesson": "Removing outer clothing and washing can remove most radioactive dust. Do it as soon as it is safe.", "ending": {"kind": "survived", "title": "Weeks of Treatment"}, "text": "The suited team finds you before you reach the street. Your clothes are still thick with dust. They hose you down, bag your clothes, and take you to a treatment centre. You will have weeks of treatment ahead, but you will live.", "fx": "calm"}, "decon": {"choices": [{"next": "rescue", "note": "You wash your hair and face thoroughly.", "text": "Remove your outer clothes, bag them, and wash off in the sink.", "effects": {"calm": 10}}, {"next": "rescue_sick", "text": "Leave everything as it is and walk out.", "effects": {"calm": -10, "health": -40}}], "text": "At the 24-hour mark, a faint voice on the radio, or just your own sense, says it is time. Rescue teams are sweeping the district. Dust still clings to your clothes and hair. Mira, if she is with you, is shivering.", "fx": "calm"}, "outside": {"choices": [{"next": "wait", "note": "You will have to deal with the dust on your clothes.", "text": "Retreat to the basement and seal the door.", "effects": {"calm": -15, "health": -25}}, {"next": "death", "note": "Fallout is lethal in the open.", "text": "Walk out to find help.", "effects": {"health": -100}}], "text": "On the ground floor, the lobby is wrecked and a fine grey ash drifts through the broken doors. The sky is dim. You breathe in a mouthful of dust and cough hard. You realise the mistake: that air is not safe. Radioactive fallout is most dangerous in the first hours.", "fx": "dark"}, "rescue": {"choices": [{"next": "hero_ending", "requires": {"flags": ["helped_mira"]}, "text": "Lead the others from the building to the evacuation point.", "hiddenIfLocked": true}, {"text": "Follow the rescue team out.", "next": "survived_ending"}], "text": "A team in protective suits finds you and checks you with a handheld detector. \"Clean,\" one of them says. \"You did everything right.\"", "fx": "calm"}, "wait": {"choices": [{"hiddenIfLocked": true, "next": "decon", "requires": {"items": ["radio"]}, "text": "Tune the radio and follow the instructions.", "effects": {"calm": 15}}, {"hiddenIfLocked": true, "next": "decon", "requires": {"items": ["water"]}, "text": "Drink from your water bottle and wait.", "effects": {"calm": 10}}, {"next": "decon", "text": "Wait without any news.", "effects": {"calm": -15, "health": -15}}], "text": "Twelve hours in. Your mouth is dry. Without the battery radio, you would not have heard the emergency broadcast. With it, a calm voice repeats: \"Stay inside. Do not leave your shelter for at least 24 hours. Remove outer clothing. Wash exposed skin.\"", "fx": "dark"}, "survived_ending": {"lesson": "Shelter immediately and stay there for at least 24 hours unless authorities say otherwise.", "ending": {"kind": "survived", "title": "The Quiet Morning"}, "text": "You step out into a world turned grey. The wind carries the smell of smoke and wet concrete. The rescuers load you onto a truck with a hundred other survivors. You will never take an ordinary Tuesday for granted again.", "fx": "calm"}}, "icon": "\u2622\ufe0f", "deathNode": "death", "lesson": "Official guidance after a nuclear alert: Get Inside, Stay Inside, Stay Tuned.", "disaster": "Nuclear Missile"}];const T={none:'#0000',calm:'#0000',quake:'#5a46284a',flood:'#1450a04a',fire:'#e65a1450',wave:'#0a6eaa55',dark:'#00000099'};
const EC={survived:'#5abe78',hero:'#fac83c',died:'#dc4646'},EL={survived:'SURVIVED',hero:'HERO ENDING',died:'DID NOT SURVIVE'};
const found=JSON.parse(localStorage.found||'{}');let sc,st,tok=0;
const $=s=>document.querySelector(s),app=$('#app');
function menu(){tok++;$('#tint').style.background=T.none;app.innerHTML=`<h1>SURVIVE THE DISASTER</h1><div class=sub>Choose a situation. Every choice changes the story. Can you find every ending?</div><div class=grid>${S.map(s=>{const t=Object.values(s.nodes).filter(n=>n.ending).length,f=Object.keys(found[s.id]||{}).length;return `<button class=card onclick="start('${s.id}')"><div class=ic>${s.icon}</div><div class=ct>${s.title}</div><div class=tag>${s.place} / ${s.disaster} / ${s.difficulty}</div><div class=bl>${s.blurb}</div><div class=en>Endings found: ${f} / ${t}</div></button>`}).join('')}</div>`}
function start(id){sc=S.find(s=>s.id==id);st={node:sc.start,health:100,calm:100,items:{},flags:{},note:'',steps:0};render()}
const ok=r=>{if(!r)return[1];for(const i of r.items||[])if(!st.items[i])return[0,'Needs: '+i];for(const f of r.flags||[])if(!st.flags[f])return[0,'Not possible right now'];for(const f of r.notFlags||[])if(st.flags[f])return[0,'Not possible right now'];return[1]};
const fx=e=>{if(!e)return;const c=(v,d)=>Math.max(0,Math.min(100,v+d));if(e.health)st.health=c(st.health,e.health);if(e.calm)st.calm=c(st.calm,e.calm);(e.give||[]).forEach(i=>st.items[i]=1);(e.take||[]).forEach(i=>delete st.items[i]);(e.set||[]).forEach(f=>st.flags[f]=1)};
function pick(i){const n=sc.nodes[st.node],c=n.choices[i];if(!ok(c.requires)[0])return;st.steps++;st.note=c.note||'';fx(c.effects);let t=c.next;
 if(c.chance){let p=c.chance.p;if(st.calm<=25)p-=.15;const b=c.chance.boostItems||(c.chance.boostItem?[c.chance.boostItem]:[]);if(b.some(x=>st.items[x]))p+=c.chance.boost||.2;p=Math.max(.05,Math.min(.95,p));if(Math.random()<p){t=c.chance.win;if(c.chance.winNote)st.note=c.chance.winNote}else{t=c.chance.lose;fx(c.chance.loseEffects);if(c.chance.loseNote)st.note=c.chance.loseNote}}
 if(st.health<=0){t=sc.deathNode;st.note+=' Your injuries are too severe.'}st.node=t;render()}
function render(){const n=sc.nodes[st.node],my=++tok;$('#tint').style.background=T[n.fx||'none'];
 app.innerHTML=`<div id=panel><div class=top><b>${sc.title}</b><button onclick=menu()>Menu</button></div>
 <div class=bars><div class=bar><i style="width:${st.health}%;background:#c84646"></i><span>Health</span></div><div class=bar><i style="width:${st.calm}%;background:#468cd2"></i><span>Calm</span></div></div>
 <div id=items>Items: ${Object.keys(st.items).join(', ')||'none'}${st.calm<=25?'     PANICKING: risky moves are harder':''}</div>
 <div id=story></div><div id=note>${st.note}</div><div id=ch></div></div>`;
 if(n.fx=='quake'||n.fx=='wave'){const p=$('#panel');p.classList.add('shake')}
 let i=0;const el=$('#story'),txt=n.text;const done=()=>{if(tok==my){el.textContent=txt;choices(n)}};
 el.onclick=()=>{if(i<txt.length){i=1e9;done()}};
 (function tick(){if(tok!=my)return;if(i>=txt.length)return done();i+=3;el.textContent=txt.slice(0,i);setTimeout(tick,12)})()}
function choices(n){const box=$('#ch');if(n.ending){const e=n.ending;if(!found[sc.id])found[sc.id]={};found[sc.id][st.node]=1;localStorage.found=JSON.stringify(found);
 box.innerHTML=`<div class=end><h2 style="color:${EC[e.kind]}">${EL[e.kind]}: ${e.title}</h2><div style="color:#c8cddc">What to remember: ${n.lesson||sc.lesson}</div><div style="color:#969bb0;margin-top:6px;font-size:14px">You made ${st.steps} decisions.</div><div class=row><button style="background:#32785a" onclick="start('${sc.id}')">Try a different path</button><button onclick=menu()>Back to menu</button></div></div>`;return}
 box.innerHTML='';n.choices.forEach((c,i)=>{const [o,why]=ok(c.requires);if(!o&&c.hiddenIfLocked)return;const b=document.createElement('button');b.className='ch'+(o?'':' lock');b.textContent=c.text+(o?'':'   ['+why+']')+(c.chance&&o?'   (risky)':'');if(o)b.onclick=()=>pick(i);box.appendChild(b)})}
menu();
</script>
